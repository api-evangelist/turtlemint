name: Turtlemint
description: >-
  Turtlemint is an Indian insurtech that sells and services insurance (health,
  motor, life) and financial products to consumers and, through its advisor
  platform TurtlemintPro, to a large network of point-of-sale agents. Its B2B
  arm, Turtlefin, productizes that stack as embedded-insurance technology: the
  OneAPI platform exposes REST APIs (OpenAPI 3.0 / Swagger) for lookups/master
  data, quotes, proposals and payments so that banks, fintechs and e-commerce
  partners can embed insurance purchase into their own journeys, alongside the
  white-labeled DigitalCore platform and a sales-certification LMS.
