summary: >-
  Turtlefin OneAPI ships a "Developer Playground" — a default SANDBOX testing
  environment surfaced through the portal's "Try this API" feature. Developers
  can exercise every endpoint in real time with no local setup, using
  plug-and-play code snippets in multiple languages (Python, Node.js,
  JavaScript, etc.) and readymade vanilla-JS UI widgets. The response window
  shows both raw and formatted responses with the HTTP status code.
sandbox:
  name: Developer Playground
  feature: "Try this API"
  environment: SANDBOX (default)
  access: https://app.turtlefin.com/dev-portal/login
  real_time_testing: true
  code_snippet_languages: [python, nodejs, javascript]
  ui_widgets: true
test_values:
  published: false
  note: >-
    Test cards, magic identifiers, and fixture tokens (if any) are exposed only
    inside the authenticated Developer Playground — none are published on the
    public docs, so none are recorded here (no fabrication).
